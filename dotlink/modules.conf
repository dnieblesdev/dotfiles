# Explicit mappings are literal data, not shell code.
[module bash]
[link]
source = .bashrc
target = .bashrc

[module fish]
[link]
source = .config/fish/conf.d/dotfiles.fish
target = fish/conf.d/dotfiles.fish
base = xdg_config

[module config]
[link]
source = .config/starship.toml
target = .config/starship.toml

[module git]
[link]
source = .gitconfig
target = .gitconfig

[module git-win]
[link]
source = .gitconfig.win
target = .gitconfig.win

[module zsh]
[link]
source = .zshrc
target = .zshrc

[module agents]
[link]
source = skills
target = .agents/skills
