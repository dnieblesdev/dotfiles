# Explicit mappings are literal data, not shell code.
[module bash]
[link]
source = .bashrc
target = .bashrc

[module git]
[link]
source = .gitconfig
target = .gitconfig

[module git-win]
[link]
source = .gitconfig.win
target = .gitconfig.win

[module zsh]
[link]
source = .zshrc
target = .zshrc

[module agents]
[link]
source = skills
target = .agents/skills
